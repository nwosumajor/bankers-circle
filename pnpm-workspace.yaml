packages:
  - apps/*
  - packages/*

# Expo/Metro is most reliable with a flat node_modules in a monorepo.
nodeLinker: hoisted

# Dependency install scripts are blocked unless approved here (pnpm 11+).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  # Optional native extras with pure-JS fallbacks; not needed.
  cpu-features: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.20'
  - '@expo/config-plugins@58.0.13'
  - '@expo/config@58.0.12'
  - '@expo/env@2.6.0'
  - '@expo/fingerprint@0.21.10'
  - '@expo/image-utils@0.12.7'
  - '@expo/inline-modules@0.2.10'
  - '@expo/local-build-cache-provider@58.0.12'
  - '@expo/metro-config@58.0.22'
  - '@expo/metro-file-map@58.0.6'
  - '@expo/plist@0.10.2'
  - '@expo/prebuild-config@58.0.20'
  - '@expo/require-utils@58.0.6'
  - '@expo/router-server@58.0.22'
  - babel-preset-expo@58.0.25
  - expo-asset@58.0.21
  - expo-constants@58.0.16
  - expo-font@58.0.12
  - expo-keep-awake@58.0.4
  - expo-modules-autolinking@58.1.0
  - expo-modules-cli@0.5.0
  - expo-modules-core@58.1.0
  - expo-modules-jsi@58.0.23
  - expo-server@58.1.0
  - expo@58.0.24
  - expo-linking@58.0.17
  - expo-router@58.0.31
  - expo-status-bar@58.0.5

# One React for the whole repo, set by the Expo SDK (apps/mobile). Next.js and libraries
# otherwise pull a newer patch and a server ends up with two Reacts. Bump with each Expo SDK.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
